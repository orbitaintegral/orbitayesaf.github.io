<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Órbita | Sistema de mentoría Yesaf</title><style>
:root{--bg:#f7f6fa;--ink:#252233;--muted:#777184;--primary:#7955be;--soft:#eee8f8;--line:#e6e1eb;--green:#167b5b;--amber:#a46612;--red:#b4475c;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:250px;background:#24212e;color:#eee;flex-shrink:0;padding:28px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:27px;font-weight:750;letter-spacing:-1px;padding:0 12px}.brand span{color:#bc96ff}.brand small{font-size:10px;display:block;color:#aaa1bd;font-weight:500;letter-spacing:1.4px;margin-top:4px}.project{padding:20px 12px;color:#c9c3d3;font-size:12px;line-height:1.7}.nav button{border:0;width:100%;background:transparent;color:#cfc8d9;padding:12px 14px;text-align:left;border-radius:10px;margin:2px 0;font-size:13px}.nav button:hover,.nav button.active{background:#473b59;color:white}.sidebar .foot{margin:24px 12px;color:#a99fb8;font-size:11px;line-height:1.6}.main{min-width:0;flex:1;padding:32px 42px;max-width:1600px}.top{display:flex;align-items:start;justify-content:space-between;gap:16px;margin-bottom:24px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--primary);text-transform:uppercase}h1{font-size:29px;letter-spacing:-.8px;margin:6px 0 8px}h2{font-size:19px;margin:0 0 14px}h3{font-size:15px;margin:0 0 12px}p{line-height:1.6;color:var(--muted);font-size:14px;margin:6px 0}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:10px 14px;border-radius:9px;font-size:12px;font-weight:700}.btn:hover{border-color:var(--primary)}.btn.primary{background:var(--primary);color:white;border-color:var(--primary)}.btn.danger{color:var(--red)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:20px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:21px;box-shadow:0 4px 18px #31243e06}.stat-label{font-size:12px;color:var(--muted)}.stat-number{font-size:30px;letter-spacing:-1px;font-weight:750;margin:10px 0 5px}.stat-sub{font-size:11px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:17px;margin:17px 0}.gridtwo{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin:17px 0}.track{height:9px;background:#ede9f2;border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--primary);border-radius:20px}.badge{display:inline-block;padding:5px 9px;background:var(--soft);border-radius:30px;font-size:11px;color:#6d43aa;white-space:nowrap}.badge.done{background:#def2ea;color:#0b7350}.badge.progress{background:#fff0d5;color:#925d08}.badge.overdue{background:#ffe5e8;color:#a6294a}.small{font-size:12px;color:var(--muted)}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);font-weight:650;font-size:11px;letter-spacing:.2px;background:#faf9fc}th,td{padding:12px;border-bottom:1px solid #f0edf2;vertical-align:top}td strong{font-weight:650}tr:last-child td{border-bottom:0}.barrow{margin:17px 0}.barlabel{display:flex;justify-content:space-between;font-size:12px;margin:0 0 8px}.muted{color:var(--muted)}.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.month{background:#faf9fc;border:1px solid var(--line);border-radius:10px;padding:15px}.month h3{color:var(--primary)}.month p{font-size:12px}.filters{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0}.input,select,textarea{border:1px solid #ddd6e6;background:white;padding:10px 11px;border-radius:8px;color:var(--ink);font-size:13px;max-width:100%}.input:focus,select:focus,textarea:focus{outline:2px solid #d4c3f5}.filters input{min-width:220px}.page{display:none}.page.active{display:block}.record{border:1px solid var(--line);border-radius:10px;padding:16px;margin:10px 0;background:white}.record-head{display:flex;justify-content:space-between;gap:15px;align-items:center}.record p{margin:8px 0;font-size:12px}.pill{font-size:11px;color:var(--muted);margin-right:9px}.empty{text-align:center;color:var(--muted);padding:30px}.modalback{position:fixed;inset:0;background:#19131dbb;z-index:5;display:none;justify-content:center;align-items:center;padding:16px}.modalback.open{display:flex}.modal{background:white;border-radius:14px;padding:25px;max-height:90vh;overflow:auto;width:min(640px,100%)}.modal h2{margin:0 0 15px}.field{margin:12px 0}.field label{display:block;margin-bottom:5px;font-size:12px;color:#60576e;font-weight:700}.field input,.field textarea,.field select{width:100%}.field textarea{min-height:75px;resize:vertical}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.note{background:#f5f1fa;border-left:3px solid var(--primary);padding:13px 16px;border-radius:4px;font-size:12px;line-height:1.6;color:#605772}.step{border-left:2px solid #c7b2ec;margin-left:8px;padding:2px 0 14px 18px;position:relative}.step:before{content:'';position:absolute;width:11px;height:11px;border-radius:50%;background:#a88ad9;left:-6px;top:4px}.step strong{font-size:12px}.step p{font-size:12px}.right{text-align:right}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.metric{padding:14px;border:1px solid var(--line);border-radius:9px;background:#fdfcff;margin:9px 0}.metric-name{font-size:13px;font-weight:700}.metric .value{font-size:20px;font-weight:750;margin:6px 0}.details{background:#f9f6fd;border-radius:8px;padding:10px 13px;font-size:12px;color:#665a72;line-height:1.6}a{color:var(--primary)}@media(max-width:900px){.sidebar{width:68px;padding:24px 8px}.brand{font-size:15px;padding:4px}.brand small,.project,.foot{display:none}.nav button{font-size:0;text-align:center}.nav button::first-letter{font-size:19px}.main{padding:24px 18px}.cards{grid-template-columns:repeat(2,1fr)}.grid2,.gridtwo{grid-template-columns:1fr}}@media(max-width:520px){.cards,.timeline,.fields{grid-template-columns:1fr}.top{display:block}.toolbar{margin:12px 0}.main{padding:18px 10px}h1{font-size:23px}.sidebar{width:53px;padding:12px 4px}.card,.panel{padding:15px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">órbita<span>.</span><small>INTEGRAL · CONSULTORÍA</small></div><div class="project">PROYECTO ACTIVO<br><strong style="color:white">Yesaf Alta Costura</strong><br>Programa de 3 meses</div><nav class="nav" id="nav"></nav><div class="foot">Sistema local de seguimiento<br>v1.0 · Los cambios se guardan en este navegador.</div></aside><main class="main"><header class="top"><div><div class="eyebrow">Órbita Integral / Yesaf Alta Costura</div><h1 id="pageTitle">Centro de control</h1><p id="pageSubtitle">Asesoría, implementación y mejora continua · 12 sesiones base</p></div><div class="toolbar"><button class="btn" onclick="exportData()">↓ Exportar respaldo</button><button class="btn" onclick="document.getElementById('importFile').click()">↑ Importar</button><input id="importFile" style="display:none" type="file" accept="application/json" onchange="importData(event)"></div></header><div id="overview" class="page active"></div><div id="plan" class="page"></div><div id="sessions" class="page"></div><div id="tasks" class="page"></div><div id="procedures" class="page"></div><div id="metrics" class="page"></div><div id="records" class="page"></div><div id="team" class="page"></div><div id="guide" class="page"></div></main></div><div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()"><form class="modal" id="editForm" onsubmit="saveModal(event)"><h2 id="modalTitle"></h2><div id="modalFields"></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" type="submit">Guardar cambios</button></div></form></div><script>
const TOPICS=[['Diagnóstico y administración','Mes 1','Diagnosticar brechas y registrar la información básica.'],['Funciones y objetivos','Mes 1','Acordar roles, metas individuales y delegación.'],['Procesos y control del trabajo','Mes 2','Mapear, probar y ajustar el recorrido del pedido.'],['Modelo de negocio y marca','Mes 2','Definir cliente, oferta y propuesta de valor.'],['Atención y seguimiento comercial','Mes 3','Registrar consultas, cotizaciones y seguimiento.'],['Automatización, medición y mejora','Mes 3','Probar un flujo digital y un tablero de control.']];
const SESSION_NAMES=['Apertura, entrevistas y diagnóstico','Validación de prioridades y registro administrativo','Entrevistas de funciones y retos','Metas, responsabilidades y delegación','Observación del recorrido del pedido','Prueba del flujo, responsables y control','Análisis del negocio y cliente objetivo','Validación de propuesta de valor y mensajes','Diseño del seguimiento comercial','Práctica de cotización y comunicación','Configuración de automatización y métricas','Pruebas, transferencia y cierre'];
const DELIVERABLES=[['Diagnóstico y matriz de prioridades',1],['Registro de ingresos, egresos y compromisos',1],['Matriz de responsabilidades y aprobaciones',2],['Fichas individuales y objetivos',2],['Mapa y procedimiento del pedido',3],['Ficha de pedido, control y checklist',3],['Lienzo de negocio y perfil del cliente',4],['Propuesta de valor y guía de marca',4],['Registro de clientes y cotizaciones',5],['Guiones y calendario de comunicación',5],['Formulario o flujo digital básico',6],['Tablero, informe final y plan de continuidad',6]];
const uid=()=>Math.random().toString(36).slice(2,10); const today=()=>new Date().toISOString().slice(0,10);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const initial=()=>({version:1,project:{name:'Yesaf Alta Costura',start:'',mode:'Programa base',owner:'Yesaf'},sessions:SESSION_NAMES.map((title,i)=>({id:uid(),number:i+1,title,topic:Math.floor(i/2)+1,status:'Pendiente',date:'',responsible:'Asesoría Órbita',notes:'',evidence:''})),tasks:DELIVERABLES.map(([title,topic])=>({id:uid(),title,topic,status:'Pendiente',priority:'Media',owner:'Por asignar',due:'',evidence:'',notes:'',type:'Entregable'})),procedures:[{id:uid(),name:'Procedimiento de acompañamiento Órbita',area:'Consultoría',status:'Borrador',owner:'Asesoría Órbita',version:'1.0',steps:'1. Levantar información y evidencia disponible\n2. Diseñar herramienta con responsables\n3. Validar con Yesaf\n4. Aplicar en caso piloto\n5. Medir resultados e incidencias\n6. Ajustar, versionar y capacitar\n7. Entregar y acordar continuidad',approval:'Yesaf',evidence:'Acta de validación y prueba piloto'},{id:uid(),name:'Recorrido del pedido de alta costura (por validar)',area:'Operaciones',status:'Borrador',owner:'Por definir',version:'0.1',steps:'1. Recibir consulta y requisitos\n2. Preparar cotización\n3. Obtener aprobación\n4. Registrar medidas y ficha de pedido\n5. Producir y controlar avances\n6. Realizar pruebas y registrar ajustes\n7. Verificar calidad y entregar',approval:'Yesaf',evidence:'Ficha de pedido, fechas e incidencias'}],metrics:[{id:uid(),name:'Tiempo promedio de respuesta',area:'Comercial',unit:'horas',direction:'down',target:'',value:'',frequency:'Semanal',owner:'Por definir',method:'Suma de horas hasta primera respuesta / total de consultas respondidas',source:'Registro comercial',updated:''},{id:uid(),name:'Conversión de cotizaciones',area:'Comercial',unit:'%',direction:'up',target:'',value:'',frequency:'Mensual',owner:'Por definir',method:'Cotizaciones aceptadas / cotizaciones emitidas × 100',source:'Registro de cotizaciones',updated:''},{id:uid(),name:'Pedidos entregados a tiempo',area:'Operaciones',unit:'%',direction:'up',target:'',value:'',frequency:'Semanal',owner:'Por definir',method:'Pedidos entregados en o antes de fecha comprometida / pedidos entregados × 100',source:'Control de pedidos',updated:''},{id:uid(),name:'Pedidos con retrabajo',area:'Operaciones',unit:'%',direction:'down',target:'',value:'',frequency:'Mensual',owner:'Por definir',method:'Pedidos con correcciones no previstas / pedidos terminados × 100',source:'Registro de incidencias',updated:''},{id:uid(),name:'Registros administrativos completos',area:'Administración',unit:'%',direction:'up',target:'',value:'',frequency:'Semanal',owner:'Por definir',method:'Registros completos / registros revisados × 100',source:'Libro de movimientos',updated:''}],records:[],team:[{id:uid(),name:'Yesaf',role:'Dirección creativa y corporativa',responsibilities:'Validar prioridades, marca, procedimientos y decisiones comerciales',goal:'Validar las herramientas y delegar la operación',status:'Activo'},{id:uid(),name:'Asesoría Órbita',role:'Asesoría y mentoría',responsibilities:'Diagnóstico, talleres, materiales, capacitación y revisión de evidencias',goal:'Instalar y transferir las herramientas acordadas',status:'Activo'}]});
const STORAGE='orbita_yesaf_v1';let db;try{db=JSON.parse(localStorage.getItem(STORAGE))||initial()}catch(e){db=initial()}let active='overview',modalType='',modalId=null;function persist(){localStorage.setItem(STORAGE,JSON.stringify(db));render()};function pct(a,b){return b?Math.round(a/b*100):0};const done=x=>x.status==='Completado'||x.status==='Validado';const fmt=n=>new Intl.NumberFormat('es-PE').format(n);function badge(s){return `<span class="badge ${['Completado','Validado'].includes(s)?'done':s==='En curso'||s==='En prueba'?'progress':s==='Bloqueado'?'overdue':''}">${esc(s)}</span>`}function getTopic(n){return TOPICS[(Number(n)||1)-1]?.[0]||'—'}function options(list,selected){return list.map(x=>`<option value="${esc(x)}" ${x===selected?'selected':''}>${esc(x)}</option>`).join('')};function navTo(id){active=id;document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id===id));document.querySelectorAll('.nav button').forEach(el=>el.classList.toggle('active',el.dataset.to===id));const item=NAV.find(x=>x.id===id);document.getElementById('pageTitle').textContent=item.title;document.getElementById('pageSubtitle').textContent=item.subtitle;render()};const NAV=[{id:'overview',label:'◈  Tablero de control',title:'Centro de control',subtitle:'Panorama de ejecución, evidencias, metas y próximos pasos'},{id:'plan',label:'▦  Plan de 3 meses',title:'Plan de implementación',subtitle:'6 temas de trabajo y 12 sesiones distribuidas en tres meses'},{id:'sessions',label:'◷  Sesiones',title:'Sesiones de mentoría',subtitle:'Agenda, actas, acuerdos, responsables y evidencia'},{id:'tasks',label:'☑  Tareas y entregables',title:'Tareas y entregables',subtitle:'Responsables, prioridades, fechas y verificaciones'},{id:'procedures',label:'⇄  Procedimientos',title:'Biblioteca de procedimientos',subtitle:'Flujos de trabajo, versiones, validaciones y mejora continua'},{id:'metrics',label:'▥  Indicadores',title:'Sistema de métricas',subtitle:'Definiciones, metas y mediciones por área'},{id:'records',label:'▤  Bitácora y evidencias',title:'Bitácora y evidencias',subtitle:'Registrar decisiones, incidencias, avances y evidencias'},{id:'team',label:'♙  Equipo y funciones',title:'Personas y responsabilidades',subtitle:'Atribuciones, compromisos y objetivos por integrante'},{id:'guide',label:'ⓘ  Manual de uso',title:'Manual operativo',subtitle:'Cómo ejecutar, medir, validar y transferir el programa'}];document.getElementById('nav').innerHTML=NAV.map(x=>`<button data-to="${x.id}" onclick="navTo('${x.id}')">${x.label}</button>`).join('');
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="empty">Todavía no hay registros.</td></tr>`}</tbody></table></div>`};function actButton(type,id){return `<button class="btn" onclick="openModal('${type}','${id}')">Editar</button>`};function bar(name,value){return `<div class="barrow"><div class="barlabel"><strong>${esc(name)}</strong><span>${value}%</span></div><div class="track"><div class="fill" style="width:${value}%"></div></div></div>`};function renderOverview(){let ds=db.tasks.filter(done).length,ss=db.sessions.filter(done).length,valid=db.procedures.filter(p=>p.status==='Validado').length,measured=db.metrics.filter(m=>m.value!==''&&m.value!=null).length,overdue=db.tasks.filter(t=>!done(t)&&t.due&&t.due<today());document.getElementById('overview').innerHTML=`<div class="note"><strong>Base del proyecto:</strong> programa de asesoría de 3 meses, 6 temas y 12 sesiones. Las metas del negocio se validarán con datos reales; los valores vacíos no se consideran cero. Las fechas son referenciales hasta definir el inicio.</div><div class="cards"><div class="card"><div class="stat-label">Entregables finalizados</div><div class="stat-number">${ds}/${db.tasks.length}</div><div class="stat-sub">${pct(ds,db.tasks.length)}% de avance</div></div><div class="card"><div class="stat-label">Sesiones completadas</div><div class="stat-number">${ss}/${db.sessions.length}</div><div class="stat-sub">${pct(ss,db.sessions.length)}% del programa</div></div><div class="card"><div class="stat-label">Procedimientos validados</div><div class="stat-number">${valid}</div><div class="stat-sub">De ${db.procedures.length} procedimientos</div></div><div class="card"><div class="stat-label">Indicadores con dato</div><div class="stat-number">${measured}/${db.metrics.length}</div><div class="stat-sub">Medición real registrada</div></div></div><div class="grid2"><section class="panel"><div class="section-head"><h2>Avance por tema</h2><span class="small">Por entregables completados</span></div>${TOPICS.map((x,i)=>bar(`${i+1}. ${x[0]}`,pct(db.tasks.filter(t=>Number(t.topic)===i+1&&done(t)).length,db.tasks.filter(t=>Number(t.topic)===i+1).length))).join('')}</section><section class="panel"><h2>Atención prioritaria</h2><p><strong>${overdue.length}</strong> tareas vencidas · <strong>${db.tasks.filter(t=>t.status==='Bloqueado').length}</strong> bloqueadas</p>${overdue.slice(0,5).map(t=>`<div class="record"><strong>${esc(t.title)}</strong><p>Vencimiento: ${esc(t.due)} · ${esc(t.owner)}</p></div>`).join('')||'<div class="details">No hay tareas vencidas. Asigna fechas para activar las alertas.</div>'}<h3 style="margin-top:22px">Próxima sesión pendiente</h3>${(()=>{let s=db.sessions.find(s=>!done(s));return s?`<p><strong>Sesión ${s.number}:</strong> ${esc(s.title)}</p><p>Fecha: ${esc(s.date||'Sin programar')}</p><button class="btn" onclick="openModal('sessions','${s.id}')">Registrar avance</button>`:'<p>Todas las sesiones están completadas.</p>'})()}</section></div><section class="panel"><div class="section-head"><h2>Estado de indicadores del negocio</h2><button class="btn" onclick="navTo('metrics')">Ver métricas</button></div>${table(['Indicador','Área','Valor actual','Meta','Frecuencia'],db.metrics.slice(0,8).map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.area)}</td><td><strong>${m.value!==''?esc(m.value)+' '+esc(m.unit):'Sin línea base'}</strong></td><td>${m.target!==''?esc(m.target)+' '+esc(m.unit):'Por acordar'}</td><td>${esc(m.frequency)}</td></tr>`))}</section>`}
function renderPlan(){document.getElementById('plan').innerHTML=`<div class="timeline">${[1,2,3].map(m=>`<div class="month"><h3>MES ${m}</h3><p>${m===1?'Diagnóstico y organización':m===2?'Procesos y propuesta de valor':'Comercial e implementación'}</p>${TOPICS.map((x,i)=>x[1]===`Mes ${m}`?`<div class="record"><strong>Tema ${i+1}. ${esc(x[0])}</strong><p>${esc(x[2])}</p>${badge(db.sessions.filter(s=>s.topic===i+1).every(done)?'Completado':'Pendiente')}</div>`:'').join('')}</div>`).join('')}</div><section class="panel"><h2>Secuencia de trabajo y criterios de cierre</h2>${table(['Sesión','Tema','Actividad','Estado','Acción'],db.sessions.map(s=>`<tr><td><strong>${s.number}</strong></td><td>${esc(getTopic(s.topic))}</td><td>${esc(s.title)}</td><td>${badge(s.status)}</td><td>${actButton('sessions',s.id)}</td></tr>`))}</section>`}
function renderSessions(){document.getElementById('sessions').innerHTML=`<div class="section-head"><h2>Seguimiento de 12 sesiones</h2><span class="badge">Programa base</span></div>${table(['Sesión / fecha','Actividad','Responsable','Estado','Acta / acuerdos',''],db.sessions.map(s=>`<tr><td><strong>${s.number} · ${esc(s.date||'Sin fecha')}</strong><div class="small">Tema ${s.topic}</div></td><td>${esc(s.title)}</td><td>${esc(s.responsible)}</td><td>${badge(s.status)}</td><td>${esc((s.notes||'').slice(0,105))}${s.evidence?`<div class="small">Evidencia: ${esc(s.evidence.slice(0,70))}</div>`:''}</td><td>${actButton('sessions',s.id)}</td></tr>`))}</section>`}
function renderTasks(){let query=(document.getElementById('taskSearch')?.value||'').toLowerCase(),filtered=db.tasks.filter(t=>(t.title+' '+t.owner+' '+getTopic(t.topic)).toLowerCase().includes(query));document.getElementById('tasks').innerHTML=`<div class="section-head"><h2>Registro de tareas y recursos</h2><button class="btn primary" onclick="openModal('tasks')">+ Nueva tarea</button></div><div class="filters"><input class="input" id="taskSearch" placeholder="Buscar tarea, responsable o tema" value="${esc(query)}" oninput="filterTasks()"><span class="small">${db.tasks.filter(done).length} completadas de ${db.tasks.length}</span></div><div id="taskTable">${taskTable(filtered)}</div><p>Solo marca una tarea como completada cuando exista evidencia y se haya validado el resultado correspondiente.</p>`};function taskTable(items){return table(['Tarea / tema','Responsable','Vencimiento','Prioridad','Estado',''],items.map(t=>`<tr><td><strong>${esc(t.title)}</strong><div class="small">Tema ${t.topic} · ${esc(getTopic(t.topic))}</div>${t.evidence?`<div class="small">Evidencia: ${esc(t.evidence)}</div>`:''}</td><td>${esc(t.owner)}</td><td>${esc(t.due||'Por definir')}</td><td>${esc(t.priority)}</td><td>${badge(t.status)}</td><td>${actButton('tasks',t.id)}</td></tr>`))};function filterTasks(){let q=document.getElementById('taskSearch').value.toLowerCase();document.getElementById('taskTable').innerHTML=taskTable(db.tasks.filter(t=>(t.title+' '+t.owner+' '+getTopic(t.topic)).toLowerCase().includes(q)))}
function renderProcedures(){document.getElementById('procedures').innerHTML=`<div class="section-head"><h2>Procedimientos y control de versiones</h2><button class="btn primary" onclick="openModal('procedures')">+ Nuevo procedimiento</button></div><div class="note">Cada procedimiento debe describir los pasos, el responsable, el criterio de aprobación y la evidencia que demuestra su aplicación. Los ejemplos iniciales son borradores para validar con Yesaf.</div>${db.procedures.map(p=>`<div class="panel" style="margin-top:15px"><div class="section-head"><div><h3>${esc(p.name)}</h3><span class="pill">${esc(p.area)} · Versión ${esc(p.version)} · Responsable: ${esc(p.owner)}</span> ${badge(p.status)}</div>${actButton('procedures',p.id)}</div><div class="gridtwo"><div><strong class="small">PASOS DEL PROCEDIMIENTO</strong>${p.steps.split('\n').map(step=>`<div class="step"><strong>${esc(step)}</strong></div>`).join('')}</div><div><strong class="small">VALIDACIÓN Y CONTROL</strong><p>Aprobación: ${esc(p.approval||'Pendiente')}</p><p>Evidencia: ${esc(p.evidence||'Pendiente')}</p><p>Estado: ${esc(p.status)}</p></div></div></div>`).join('')}</div>`}
function renderMetrics(){let count=db.metrics.filter(m=>m.value!=='').length;document.getElementById('metrics').innerHTML=`<div class="section-head"><h2>Ficha de indicadores</h2><button class="btn primary" onclick="openModal('metrics')">+ Nuevo indicador</button></div><div class="note">Indicadores de negocio propuestos, todavía sin línea base ni metas aprobadas. Registra el valor y la fecha al medirlo; no reemplaces un dato inexistente por cero. En el tablero de proyecto los porcentajes se calculan a partir de sesiones y entregables.</div><div class="cards"><div class="card"><div class="stat-label">Indicadores definidos</div><div class="stat-number">${db.metrics.length}</div></div><div class="card"><div class="stat-label">Indicadores medidos</div><div class="stat-number">${count}</div></div><div class="card"><div class="stat-label">Metas establecidas</div><div class="stat-number">${db.metrics.filter(m=>m.target!=='').length}</div></div><div class="card"><div class="stat-label">Cobertura de medición</div><div class="stat-number">${pct(count,db.metrics.length)}%</div></div></div><div class="gridtwo">${db.metrics.map(m=>`<div class="panel"><div class="section-head"><h3>${esc(m.name)}</h3>${actButton('metrics',m.id)}</div><span class="pill">${esc(m.area)} · ${esc(m.frequency)}</span><div class="stat-number">${m.value!==''?esc(m.value)+' <small style="font-size:13px">'+esc(m.unit)+'</small>':'—'}</div><p>Meta: <strong>${m.target!==''?esc(m.target)+' '+esc(m.unit):'Por acordar'}</strong> · Mejorar: ${m.direction==='up'?'aumentando':'reduciendo'}</p><p>Responsable: ${esc(m.owner)}</p><div class="details"><strong>Fórmula / criterio:</strong> ${esc(m.method)}<br><strong>Fuente:</strong> ${esc(m.source)}<br><strong>Última medición:</strong> ${esc(m.updated||'Sin registrar')}</div></div>`).join('')}</div>`}
function renderRecords(){document.getElementById('records').innerHTML=`<div class="section-head"><h2>Historial del proyecto</h2><button class="btn primary" onclick="openModal('records')">+ Registrar evento</button></div><p>Almacena aquí problemas, decisiones, actas, acuerdos, pruebas y referencias de evidencia (enlaces o rutas a documentos). No se cargan archivos binarios en esta versión.</p>${db.records.length?db.records.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<div class="record"><div class="record-head"><div><strong>${esc(r.title)}</strong><span class="pill">${esc(r.date)} · ${esc(r.type)}</span></div>${actButton('records',r.id)}</div><p>${esc(r.description)}</p><p>Responsable: ${esc(r.owner||'Sin asignar')} · Relación: Tema ${esc(r.topic)}</p>${r.link?`<div class="details">Referencia / enlace de evidencia: ${esc(r.link)}</div>`:''}</div>`).join(''):'<div class="panel empty">Aún no hay anotaciones. Empieza con el acta de apertura o el primer hallazgo.</div>'}`}
function renderTeam(){document.getElementById('team').innerHTML=`<div class="section-head"><h2>Matriz de personas y funciones</h2><button class="btn primary" onclick="openModal('team')">+ Agregar integrante</button></div>${table(['Persona','Rol','Responsabilidades','Objetivo','Estado',''],db.team.map(t=>`<tr><td><strong>${esc(t.name)}</strong></td><td>${esc(t.role)}</td><td>${esc(t.responsibilities)}</td><td>${esc(t.goal)}</td><td>${badge(t.status)}</td><td>${actButton('team',t.id)}</td></tr>`))}<p>Los integrantes reales, autorizaciones y metas individuales se completan en las sesiones 3 y 4. Evita registrar datos personales innecesarios.</p>`}
function renderGuide(){document.getElementById('guide').innerHTML=`<div class="panel"><h2>1. Preparar el inicio</h2><p>Acordar fecha de inicio, modalidad, participantes, permisos y sesiones. Solicitar registros disponibles de los últimos tres meses (o el periodo existente) y reunir la primera entrega de información en los cinco días hábiles iniciales.</p><h2 style="margin-top:25px">2. Aplicar el ciclo de trabajo de cada tema</h2>${['Primera sesión: entrevistar, observar, diagnosticar y diseñar una solución.','Entre sesiones: asignar responsable y plazo; probar el recurso con casos reales y recopilar evidencia.','Segunda sesión: contrastar, capacitar, validar con Yesaf y ajustar la herramienta.','Control transversal: registrar incidencias, versiones, resultados y tareas pendientes.'].map(s=>`<div class="step"><strong>${esc(s)}</strong></div>`).join('')}<h2 style="margin-top:25px">3. Actualizar el sistema</h2><p><strong>Sesiones:</strong> anotar fecha, acuerdos, estado y referencia de acta. <strong>Tareas:</strong> asignar responsables, fecha y evidencia; después marcar completadas. <strong>Procedimientos:</strong> revisar pasos y versionar cada ajuste. <strong>Indicadores:</strong> definir fórmula, fuente, periodicidad, línea base y meta aprobada. <strong>Bitácora:</strong> guardar decisiones e incidencias.</p><h2 style="margin-top:25px">4. Revisar el tablero y cerrar</h2><p>Semanalmente, revisar tareas vencidas, sesiones, adopción, indicadores y bloqueos. Al cierre, diferenciar los recursos <strong>implementados</strong>, <strong>en prueba</strong> y <strong>pendientes</strong>, acordar el siguiente responsable y la fecha de revisión. No presentar mejoras aún no medidas como resultados consolidados.</p><h2 style="margin-top:25px">5. Seguridad, respaldo y publicación</h2><p>Este prototipo funciona sin servidor. Guarda registros en el almacenamiento local del navegador y no sincroniza entre dispositivos. Usa «Exportar respaldo» para guardar un JSON; «Importar» para restaurarlo en otro equipo. Para trabajo multiusuario real, control de acceso, adjuntos y auditoría se requiere una base de datos y autenticación, que no están implementadas.</p><div class="note">La propuesta original prevé Word/Excel o equivalentes y una automatización sencilla; el desarrollo de software completo y las licencias se cotizan aparte. Este sitio es una herramienta complementaria de seguimiento, no una plataforma de producción aprobada.</div></div>`}
function render(){renderOverview();renderPlan();renderSessions();renderTasks();renderProcedures();renderMetrics();renderRecords();renderTeam();renderGuide()}
const SCHEMA={sessions:[['date','Fecha','date'],['status','Estado','select:Pendiente|Programado|En curso|Completado|Bloqueado'],['responsible','Responsable','text'],['notes','Acta, acuerdos y siguiente acción','textarea'],['evidence','Enlace o referencia de evidencia','text']],tasks:[['title','Tarea / entregable','text'],['topic','Tema','select:1|2|3|4|5|6'],['owner','Responsable','text'],['due','Fecha límite','date'],['priority','Prioridad','select:Alta|Media|Baja'],['status','Estado','select:Pendiente|En curso|En prueba|Bloqueado|Completado'],['evidence','Evidencia (enlace o referencia)','text'],['notes','Observaciones','textarea']],procedures:[['name','Nombre del procedimiento','text'],['area','Área','text'],['owner','Responsable','text'],['version','Versión','text'],['status','Estado','select:Borrador|En prueba|Validado|Pendiente de ajuste'],['steps','Pasos (uno por línea)','textarea'],['approval','Quién aprueba','text'],['evidence','Criterio / evidencia de validación','textarea']],metrics:[['name','Nombre del indicador','text'],['area','Área','text'],['unit','Unidad (%, días, horas, S/, etc.)','text'],['direction','Dirección deseada','select:up|down'],['value','Valor actual (vacío = sin dato)','number'],['target','Meta (vacío = no acordada)','number'],['updated','Fecha de medición','date'],['frequency','Frecuencia','select:Diaria|Semanal|Quincenal|Mensual|Trimestral'],['owner','Responsable','text'],['method','Fórmula o criterio de cálculo','textarea'],['source','Fuente de datos','text']],records:[['date','Fecha','date'],['title','Título','text'],['type','Tipo','select:Acta|Acuerdo|Decisión|Incidencia|Evidencia|Mejora|Capacitación'],['topic','Tema','select:1|2|3|4|5|6'],['owner','Responsable','text'],['description','Descripción / resultado','textarea'],['link','Enlace o referencia documental','text']],team:[['name','Nombre','text'],['role','Rol','text'],['responsibilities','Responsabilidades y aprobaciones','textarea'],['goal','Objetivo de mejora','textarea'],['status','Estado','select:Activo|Pendiente|Inactivo']]};function openModal(type,id){modalType=type;modalId=id||null;let r=db[type].find(x=>x.id===id)||{};document.getElementById('modalTitle').textContent=(id?'Editar ':'Nuevo registro · ')+({tasks:'tarea',sessions:'sesión',procedures:'procedimiento',metrics:'indicador',records:'bitácora',team:'integrante'}[type]);document.getElementById('modalFields').innerHTML=SCHEMA[type].map(([key,title,kind])=>{let val=r[key]??(key==='date'?today():'');let input=kind.startsWith('select:')?`<select name="${key}">${options(kind.slice(7).split('|'),String(val))}</select>`:kind==='textarea'?`<textarea name="${key}">${esc(val)}</textarea>`:`<input type="${kind}" name="${key}" value="${esc(val)}" ${key==='title'||key==='name'?'required':''} ${kind==='number'?'step="any"':''}>`;return `<div class="field"><label>${esc(title)}</label>${input}</div>`}).join('');document.getElementById('modalback').classList.add('open')};function closeModal(){document.getElementById('modalback').classList.remove('open')};function saveModal(e){e.preventDefault();let f=new FormData(document.getElementById('editForm')),o={};for(let[k,v]of f.entries())o[k]=v;let existing=db[modalType].find(x=>x.id===modalId);if(existing)Object.assign(existing,o);else db[modalType].push({id:uid(),...o});closeModal();persist()};function exportData(){let blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='orbita-yesaf-respaldo-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(ev){let f=ev.target.files[0];if(!f)return;let rd=new FileReader;rd.onload=()=>{try{let d=JSON.parse(rd.result),next=d.data||d;if(!Array.isArray(next.tasks)||!Array.isArray(next.sessions)||!Array.isArray(next.metrics)||!Array.isArray(next.procedures)||!Array.isArray(next.records)||!Array.isArray(next.team))throw Error('Formato incompatible');if(confirm('¿Reemplazar todos los registros locales con el respaldo seleccionado?')){db=next;persist();alert('Respaldo importado correctamente.')}}catch(e){alert('No se pudo importar: '+e.message)}ev.target.value=''};rd.readAsText(f)}navTo('overview');
</script></body></html>
